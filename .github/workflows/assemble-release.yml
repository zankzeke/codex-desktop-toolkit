name: Assemble release sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble staged source files
        shell: bash
        run: |
          set -euo pipefail

          cat .publish/proxy.b64.001 \
              .publish/proxy.b64.002 \
              .publish/proxy.b64.003 \
              .publish/proxy.b64.004 \
              .publish/proxy.b64.005 \
              > /tmp/proxy.b64
          base64 --decode /tmp/proxy.b64 > proxy.py

          cat .publish/gui3.001a \
              .publish/fixfinal.001.01a \
              .publish/fixfinal2.001.01b.1 \
              .publish/fixfinal2.001.01b.2 \
              .publish/gui4.001.02 \
              .publish/fixfinal.001.03a \
              .publish/gui5.001.03b \
              .publish/gui4.001.04 \
              .publish/gui2.b64.002 \
              .publish/gui3.003a \
              .publish/gui3.003b \
              .publish/gui4.004.01 \
              .publish/gui4.004.02 \
              .publish/gui4.004.03 \
              .publish/gui4.004.04 \
              .publish/gui3.004b \
              .publish/gui2.b64.005 \
              .publish/gui3.006a \
              .publish/gui5.006.01a \
              .publish/gui5.006.01b \
              .publish/gui4.006.02 \
              .publish/fixfinal.006.03a \
              .publish/fixfinal2.006.03b.1 \
              .publish/fixfinal3.006.03b.2a \
              .publish/fixfinal3.006.03b.2b \
              > /tmp/gui.b64
          base64 --decode /tmp/gui.b64 > codex_toolkit_gui.py

          test "$(wc -c < proxy.py)" -eq 26098
          test "$(wc -c < codex_toolkit_gui.py)" -eq 35023
          echo "dacc10458654f04b18fc238aa357b57ff3c8312b064d9504fc82da32c9688771  proxy.py" | sha256sum -c -
          echo "eb91d8c872831dbdbef34ffffbaf67cd6d740c1aded99622c450bae35ec9a38d  codex_toolkit_gui.py" | sha256sum -c -
          python -m py_compile proxy.py codex_toolkit_gui.py

      - name: Commit assembled release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.py codex_toolkit_gui.py
          git rm -r .publish
          git rm .github/workflows/assemble-release.yml
          git commit -m "release: assemble public source files"
          git push origin HEAD:main
