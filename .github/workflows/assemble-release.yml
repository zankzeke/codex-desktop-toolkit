name: Assemble release sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble staged source files
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/proxy.b64.* | base64 --decode > proxy.py
          cat .publish/gui2.b64.* | base64 --decode > codex_toolkit_gui.py
          python -m py_compile proxy.py codex_toolkit_gui.py
          test "$(wc -c < proxy.py)" -eq 26098
          test "$(wc -c < codex_toolkit_gui.py)" -eq 35023
      - name: Commit assembled release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.py codex_toolkit_gui.py
          git rm -r .publish
          git rm .github/workflows/assemble-release.yml
          git commit -m "release: assemble public source files"
          git push origin HEAD:main
