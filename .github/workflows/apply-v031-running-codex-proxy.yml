name: Apply v0.3.1 running Codex proxy activation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v031-running-codex-proxy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch runtime activation behavior
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{label}: expected {count}, found {found}")
              return text.replace(old, new, count)

          # config_manager.py: expose whether Codex config already points at the live local proxy.
          p = Path('config_manager.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''def enable_proxy_config(port: int, ws_enabled: bool) -> Tuple[bool, str]:\n'''
          helper = '''def get_proxy_config_status(port: int | None = None) -> dict:\n    """Return the current Codex provider state without modifying config.toml."""\n    result = {\n        "config_exists": CONFIG_PATH.exists(),\n        "parse_ok": False,\n        "provider": None,\n        "active": False,\n        "base_url": None,\n        "active_for_port": False,\n    }\n    if not CONFIG_PATH.exists():\n        return result\n    try:\n        with open(CONFIG_PATH, "r", encoding="utf-8") as f:\n            doc = tomlkit.load(f)\n    except Exception as e:\n        result["error"] = str(e)\n        return result\n\n    provider = str(doc.get("model_provider", "openai"))\n    providers = doc.get("model_providers", {})\n    block = providers.get("openai-idfix", {}) if providers else {}\n    base_url = str(block.get("base_url", "")) if block else ""\n\n    result.update({\n        "parse_ok": True,\n        "provider": provider,\n        "active": provider == "openai-idfix",\n        "base_url": base_url or None,\n    })\n    if port is None:\n        result["active_for_port"] = result["active"]\n    else:\n        expected = f"http://127.0.0.1:{int(port)}/v1"\n        result["active_for_port"] = result["active"] and base_url.rstrip("/") == expected.rstrip("/")\n    return result\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('config_manager enable_proxy_config anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # codex_toolkit_gui.py: after health is green, activate/restart an already-running Codex.
          p = Path('codex_toolkit_gui.py')
          text = p.read_text(encoding='utf-8')
          old_import = '''from config_manager import (\n    enable_proxy_config, disable_proxy_config, \n    load_upstreams, save_upstreams,\n    load_proxies, save_proxies\n)\n'''
          new_import = '''from config_manager import (\n    enable_proxy_config, disable_proxy_config, get_proxy_config_status,\n    load_upstreams, save_upstreams,\n    load_proxies, save_proxies\n)\n'''
          text = must_replace(text, old_import, new_import, 'config_manager import')

          anchor = '''    def _start_proxy(self):\n'''
          method = '''    def _on_proxy_ready(self, port_num: int):\n        """Handle the important case where Codex was already running before the proxy."""\n        self._set_running(True)\n        status = get_proxy_config_status(port_num)\n        codex_running = is_codex_running()\n\n        if not codex_running:\n            if not status.get("active_for_port"):\n                self._append_log(\n                    "[提示] 本地代理已启动，但 Codex 配置尚未指向该代理。请先启用代理配置，再启动 Codex。",\n                    "warn",\n                )\n            return\n\n        if status.get("active_for_port"):\n            prompt = (\n                "检测到 Codex Desktop 已经在运行。\\n\\n"\n                "Codex 在启动时会读取 provider/连接配置；仅在它运行期间启动本地代理，"\n                "当前 Codex 进程可能继续使用原连接，而不会立刻切换到新代理。\\n\\n"\n                "代理已经正常启动。是否现在重启 Codex，让它立即重新连接本地代理？"\n            )\n            if messagebox.askyesno("需要重启 Codex", prompt):\n                ok, msg = restart_codex()\n                if ok:\n                    self._append_log(f"[Codex 重启] 已重新加载代理配置: {msg}", "ok")\n                else:\n                    messagebox.showwarning("重启失败", f"{msg}\\n\\n代理仍在运行，请手动重启 Codex Desktop。")\n            else:\n                self._append_log(\n                    "[提示] 代理已运行，但当前 Codex 进程可能仍使用启动时的旧连接；重启 Codex 后生效。",\n                    "warn",\n                )\n            return\n\n        prompt = (\n            "检测到 Codex Desktop 已经在运行，但它当前的 config.toml 并未指向刚启动的本地代理。\\n\\n"\n            "只启动 127.0.0.1 的代理服务不会自动劫持/改写已经运行的 Codex 连接。\\n"\n            "要让当前 Codex 真正使用代理，需要写入 openai-idfix provider 并重启 Codex。\\n\\n"\n            "是否现在一键启用代理配置并重启 Codex？"\n        )\n        if not messagebox.askyesno("让 Codex 接入代理", prompt):\n            self._append_log(\n                "[提示] 本地代理已启动，但当前 Codex 尚未接入。请启用代理配置并重启 Codex。",\n                "warn",\n            )\n            return\n\n        ok, msg = enable_proxy_config(port_num, self._ws_var.get())\n        if not ok:\n            self._append_log(f"[配置错误] {msg}", "error")\n            messagebox.showerror("写入失败", msg)\n            return\n        self._append_log(\n            f"[配置更新] 已自动启用代理配置: 端口 {port_num}, WS={self._ws_var.get()}",\n            "ok",\n        )\n        ok, msg = restart_codex()\n        if ok:\n            self._append_log(f"[Codex 重启] 已接入本地代理: {msg}", "ok")\n        else:\n            messagebox.showwarning(\n                "重启失败",\n                f"代理配置已写入，但自动重启失败：{msg}\\n\\n请手动重启 Codex Desktop；重启后会使用本地代理。",\n            )\n\n'''
          if method not in text:
              if anchor not in text:
                  raise SystemExit('_start_proxy anchor missing')
              text = text.replace(anchor, method + anchor, 1)

          old_health = '''                    with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=1):\n                        if not self._app._closing:\n                            self._app.after(0, lambda: self._set_running(True))\n                        return\n'''
          new_health = '''                    with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=1):\n                        if not self._app._closing:\n                            self._app.after(0, lambda p=port_num: self._on_proxy_ready(p))\n                        return\n'''
          text = must_replace(text, old_health, new_health, 'health ready callback')

          old_enable = '''        if ok:\n            self._append_log(f"[配置更新] 已启用代理配置: 端口 {port}, WS={ws_enabled}", "ok")\n            messagebox.showinfo("成功", "代理配置已写入。\\n如果 Codex 正在运行，请重启 Codex Desktop 以生效。")\n        else:\n'''
          new_enable = '''        if ok:\n            self._append_log(f"[配置更新] 已启用代理配置: 端口 {port}, WS={ws_enabled}", "ok")\n            if is_codex_running():\n                if messagebox.askyesno(\n                    "配置已写入，需要重启",\n                    "Codex Desktop 当前正在运行。\\n\\n运行中的 Codex 不会可靠地热切换 provider。是否现在重启 Codex 立即生效？",\n                ):\n                    r_ok, r_msg = restart_codex()\n                    if r_ok:\n                        self._append_log(f"[Codex 重启] 已重新加载代理配置: {r_msg}", "ok")\n                        messagebox.showinfo("成功", "代理配置已写入，Codex Desktop 已重启并重新加载配置。")\n                    else:\n                        messagebox.showwarning("重启失败", f"代理配置已写入，但自动重启失败：{r_msg}\\n\\n请手动重启 Codex Desktop。")\n                else:\n                    messagebox.showinfo("成功", "代理配置已写入。当前 Codex 仍可能继续使用旧连接，重启后生效。")\n            else:\n                messagebox.showinfo("成功", "代理配置已写入。下次启动 Codex Desktop 时会使用该代理。")\n        else:\n'''
          text = must_replace(text, old_enable, new_enable, 'enable config success block')

          old_disable = '''        if ok:\n            self._append_log(f"[配置更新] {msg}", "ok")\n            messagebox.showinfo("成功", f"{msg}\\n\\n如果 Codex 正在运行，请重启 Codex Desktop 以生效。")\n        else:\n'''
          new_disable = '''        if ok:\n            self._append_log(f"[配置更新] {msg}", "ok")\n            if is_codex_running() and messagebox.askyesno(\n                "已恢复直连，需要重启",\n                f"{msg}\\n\\nCodex Desktop 当前正在运行。是否现在重启，让恢复直连立即生效？",\n            ):\n                r_ok, r_msg = restart_codex()\n                if r_ok:\n                    self._append_log(f"[Codex 重启] 已重新加载直连配置: {r_msg}", "ok")\n                else:\n                    messagebox.showwarning("重启失败", f"配置已恢复，但自动重启失败：{r_msg}\\n\\n请手动重启 Codex Desktop。")\n            else:\n                messagebox.showinfo("成功", f"{msg}\\n\\n如果 Codex 正在运行，重启后生效。")\n        else:\n'''
          text = must_replace(text, old_disable, new_disable, 'disable config success block')
          p.write_text(text, encoding='utf-8', newline='\n')

          # Version / release metadata.
          p = Path('ui_theme.py')
          text = p.read_text(encoding='utf-8')
          import re
          text, n = re.subn(r'APP_VERSION = "[^"]+"', 'APP_VERSION = "0.3.1"', text, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION replacement failed')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('tests/test_gui_metadata.py')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(r"assert ui_theme\.APP_VERSION == '[^']+'", "assert ui_theme.APP_VERSION == '0.3.1'", text, count=1)
          if n != 1:
              raise SystemExit('GUI version test replacement failed')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('tests/test_config_manager.py')
          text = p.read_text(encoding='utf-8')
          extra = '''\n\ndef test_proxy_config_status_tracks_active_port(tmp_path: Path, monkeypatch):\n    config = tmp_path / "config.toml"\n    state = tmp_path / "state.json"\n    config.write_text('model_provider = "openai"\\n', encoding="utf-8")\n    monkeypatch.setattr(config_manager, "CONFIG_PATH", config)\n    monkeypatch.setattr(config_manager, "STATE_PATH", state)\n\n    status = config_manager.get_proxy_config_status(8787)\n    assert status["parse_ok"] is True\n    assert status["active_for_port"] is False\n\n    ok, _ = config_manager.enable_proxy_config(8787, True)\n    assert ok\n    status = config_manager.get_proxy_config_status(8787)\n    assert status["active"] is True\n    assert status["active_for_port"] is True\n    assert status["base_url"] == "http://127.0.0.1:8787/v1"\n    assert config_manager.get_proxy_config_status(9999)["active_for_port"] is False\n'''
          if 'test_proxy_config_status_tracks_active_port' not in text:
              text += extra
          p.write_text(text, encoding='utf-8', newline='\n')

          Path('tests/test_running_codex_proxy_activation.py').write_text('''from pathlib import Path\n\n\ndef test_running_codex_is_prompted_to_reload_proxy_config():\n    text = Path("codex_toolkit_gui.py").read_text(encoding="utf-8")\n    assert "def _on_proxy_ready" in text\n    assert "get_proxy_config_status(port_num)" in text\n    assert "enable_proxy_config(port_num, self._ws_var.get())" in text\n    assert "restart_codex()" in text\n    assert "运行中的 Codex 不会可靠地热切换 provider" in text\n''', encoding='utf-8', newline='\n')

          # README and changelog.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'CodexBridgeToolkit-[0-9.]+-windows-x64\.zip', 'CodexBridgeToolkit-0.3.1-windows-x64.zip', text, count=1)
          marker = '3. Start `CodexBridgeToolkit.exe`.\n'
          note = '\n> If Codex Desktop is already running when you start the local proxy, the toolkit now detects that state and offers to apply/confirm the proxy provider and restart Codex. A running Codex process does not reliably hot-switch provider connections just because the local proxy starts later.\n'
          if marker in text and 'does not reliably hot-switch provider connections' not in text:
              text = text.replace(marker, marker + note, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          entry = '''## 0.3.1 - 2026-09-14\n\n- Fixed the case where Codex Desktop was already running before the local proxy was started.\n- After proxy health succeeds, the GUI now detects the active Codex provider and offers to apply `openai-idfix` plus restart Codex when needed.\n- If the provider already points to the proxy, the GUI offers a restart so the existing Codex process reloads its transport/provider state.\n- Enabling or disabling the proxy config while Codex is running now offers an immediate restart instead of only showing a passive reminder.\n\n'''
          if entry not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Prepare the release workflow for v0.3.1 without changing its structure.
          p = Path('.github/workflows/release.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('default: v0.3.0', 'default: v0.3.1', 1)
          text = text.replace('DEFAULT_TAG: v0.3.0', 'DEFAULT_TAG: v0.3.1', 1)
          highlight = '          ### Highlights\n'
          new_highlight = '          ### Highlights\n          - 🔄 **Running Codex activation fix**: starting the proxy after Codex is already open now offers to apply/confirm the provider and restart Codex so traffic actually uses the proxy\n'
          if highlight in text and 'Running Codex activation fix' not in text:
              text = text.replace(highlight, new_highlight, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex_toolkit_gui.py config_manager.py ui_theme.py README.md CHANGELOG.md .github/workflows/release.yml tests/test_gui_metadata.py tests/test_config_manager.py tests/test_running_codex_proxy_activation.py
          git commit -m "fix: activate proxy for already-running Codex v0.3.1"
          git push origin HEAD:main
