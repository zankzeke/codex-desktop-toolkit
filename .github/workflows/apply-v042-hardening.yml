name: Apply v0.4.2 hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v042-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply hardening patch
        run: python .github/scripts/apply_v042.py

      - name: Validate source and behavior tests
        run: |
          python -m pip install -r requirements-release.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit v0.4.2 and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v042-hardening.yml .github/scripts/apply_v042.py
          git add -A
          git commit -m "release: v0.4.2 repository and runtime hardening [release]"
          git push origin HEAD:main
