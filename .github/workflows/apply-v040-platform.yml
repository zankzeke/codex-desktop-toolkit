    runner = web.AppRunner(upstream)
    await runner.setup()
    site = web.TCPSite(runner, "127.0.0.1", 0)
    await site.start()
    upstream_port = site._server.sockets[0].getsockname()[1]
    proxy_port = free_port()

    proc = subprocess.Popen([
        str(exe), "--port", str(proxy_port),
        "--upstream", f"http://127.0.0.1:{upstream_port}",
        "--proxy-mode", "direct", "--log-level", "INFO",
    ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
    try:
        deadline = time.time() + 15
        while time.time() < deadline:
            try:
                with urllib.request.urlopen(f"http://127.0.0.1:{proxy_port}/health", timeout=1) as r:
                    if r.status == 200:
                        break
            except Exception:
                await asyncio.sleep(0.25)
        else:
            raise RuntimeError("packaged proxy health timeout")

        async with ClientSession() as session:
            async with session.post(f"http://127.0.0.1:{proxy_port}/v1/responses", json={"input": []}) as r:
                data = await r.json()
                assert data["id"] == FIXED

            async with session.get(f"http://127.0.0.1:{proxy_port}/v1/responses?stream=1") as r:
                text = await r.text()
                assert "msg_dddddddddddddddd" in text

            ws = await session.ws_connect(
                f"http://127.0.0.1:{proxy_port}/v1/responses",
                protocols=("codex-smoke",),
            )
            await ws.send_str(json.dumps({"input": [{"type": "message", "id": RAW}]}))
            msg = await ws.receive(timeout=3)
            assert FIXED in msg.data
            await ws.close()

            async with session.get(f"http://127.0.0.1:{proxy_port}/stats") as r:
                stats = await r.json()
                assert stats["traffic_verified"] is True
                assert stats["requests_total"] >= 3
                assert stats["websocket"]["handshakes"] >= 1
    finally:
        proc.kill()
        try:
            proc.wait(timeout=5)
        except Exception:
            pass
        await runner.cleanup()


