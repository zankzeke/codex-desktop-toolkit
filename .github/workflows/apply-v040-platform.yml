name: Apply v0.4.0 reliability platform

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v040-platform.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix migration string escaping
        shell: pwsh
        run: |
          $p = '.github/scripts/apply_v040.py'
          $text = Get-Content $p -Raw -Encoding utf8
          $text = $text.Replace("new_close = '''", "new_close = r'''")
          Set-Content -Path $p -Value $text -Encoding utf8

      - name: Apply migration
        run: python .github/scripts/apply_v040.py

      - name: Keep release workflow for connector-managed finalization
        shell: bash
        run: git checkout -- .github/workflows/release.yml

      - name: Validate source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reliability diagnostics tray and release hardening v0.4.0"
          git push origin HEAD:main
