name: CodeQL SARIF triage

on:
  push:
    branches: [security/codeql-alert-triage]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    # Temporary branch-only workflow used to inspect raw SARIF before merging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze without publishing duplicate alerts
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:python'
          output: codeql-results
          upload: never

      - name: Upload SARIF for triage
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-triage
          path: codeql-results/*.sarif
