name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.4.0
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    env:
      DEFAULT_TAG: v0.4.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests before packaging
        run: |
          python -m compileall -q .
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build proxy executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name CodexBridgeProxy `
            --icon assets/codex_bridge.ico `
            proxy.py

      - name: Build GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CodexBridgeToolkit `
            --icon assets/codex_bridge.ico `
            --add-data "assets;assets" `
            --collect-all pystray `
            --hidden-import pystray._win32 `
            codex_toolkit_gui.py

      - name: Smoke-test packaged proxy executable
        run: python tests/packaged_smoke.py --proxy-exe dist/CodexBridgeProxy.exe

      - name: Optional Authenticode signing
        shell: pwsh
        env:
          SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGN_CERT) {
            Write-Host "Signing secrets are not configured; publishing unsigned binaries with SHA256SUMS."
            exit 0
          }
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:SIGN_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in @("dist/CodexBridgeToolkit.exe", "dist/CodexBridgeProxy.exe")) {
            & $signtool sign /fd SHA256 /f signing.pfx /p $env:SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Remove-Item signing.pfx -Force

      - name: Create portable package
        id: package
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = $env:DEFAULT_TAG
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $version = $tag.TrimStart('v')
          $dir = "release/CodexBridgeToolkit-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist/CodexBridgeToolkit.exe "$dir/CodexBridgeToolkit.exe"
          Copy-Item dist/CodexBridgeProxy.exe "$dir/CodexBridgeProxy.exe"
          Copy-Item README.md "$dir/README.md"
          Copy-Item docs/PROXY_SETUP_ZH.md "$dir/PROXY_SETUP_ZH.md"
          Copy-Item LICENSE "$dir/LICENSE"
          @"
          Codex Bridge Toolkit $tag

          Start CodexBridgeToolkit.exe.
          Keep CodexBridgeToolkit.exe and CodexBridgeProxy.exe in the same directory.

          v0.4 reliability platform:
          - Three-layer connection truth: local proxy / Codex provider / verified real traffic
          - True-direct, system-environment and explicit outbound proxy modes
          - System tray background mode and safe restore-on-exit
          - One-click launch/restart Codex through the local compatibility proxy
          - Safer config restore that refuses to overwrite external edits
          - Diagnostics center with privacy-safe Markdown report copy
          - Error classification and WebSocket handshake/reconnect/close-code telemetry
          - Notification-only GitHub update checks; no silent installation
          - Packaged EXE smoke testing in CI
          - SHA256 checksums and optional Authenticode signing when maintainer secrets are configured

          See PROXY_SETUP_ZH.md for common Clash/v2rayN/Mihomo upstream proxy examples.
          "@ | Set-Content -Encoding utf8 "$dir/PORTABLE_README.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "release/CodexBridgeToolkit-$version-windows-x64.zip" -Force
          "zip=release/CodexBridgeToolkit-$version-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/CodexBridgeToolkit.exe",
            "dist/CodexBridgeProxy.exe",
            "${{ steps.package.outputs.zip }}"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridgeToolkit-windows-x64
          path: |
            dist/CodexBridgeToolkit.exe
            dist/CodexBridgeProxy.exe
            ${{ steps.package.outputs.zip }}
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.package.outputs.tag }}'
          $zip = '${{ steps.package.outputs.zip }}'
          $version = $tag.TrimStart('v')
          @"
          ## Codex Bridge Toolkit $tag

          Windows packaged release. No separate Python installation is required.

          **Recommended:** download `CodexBridgeToolkit-$version-windows-x64.zip`, extract it, and keep both executables together.

          ### v0.4 reliability & diagnostics platform
          - **Three-layer connection truth** — distinguishes local proxy health, Codex provider attachment, and verified real Codex traffic.
          - **Deterministic outbound networking** — true direct mode ignores proxy environment variables; system-environment and explicit HTTP/Mixed proxy modes are separate choices.
          - **System tray background mode** — closing the main window can keep the proxy alive; safe exit can restore the previous Codex provider before stopping it.
          - **One-click launch through proxy** — prepares the proxy/provider and launches or restarts Codex in one flow.
          - **Safer config restore** — external/manual `config.toml` edits are detected instead of silently overwritten.
          - **Diagnostics center** — Codex version/provider, last request/status, ID rewrite counts, WebSocket telemetry, error classification, and copyable redacted Markdown report.
          - **WebSocket observability** — handshake count, follow-up connection/reconnect counter, failures, timestamps and close codes such as 1006/1008/1011.
          - **Conservative update checks** — notification only; Toolkit never silently downloads or installs a new version.
          - **Packaged-binary smoke test** — CI exercises the built proxy EXE over health, HTTP, SSE and WebSocket before publishing.
          - **Release integrity** — `SHA256SUMS.txt` is included. Authenticode signing is optional and only applied when maintainer signing secrets are configured.

          Privacy note: runtime stats are local-only and do not store authentication headers, cookies, request/response bodies, or URL query strings.

          This is an unofficial community project and is not affiliated with OpenAI.
          "@ | Set-Content -Encoding utf8 release-notes.md

          if (gh release view $tag 2>$null) {
            gh release edit $tag --title "Codex Bridge Toolkit $tag" --notes-file release-notes.md
            gh release upload $tag $zip dist/CodexBridgeToolkit.exe dist/CodexBridgeProxy.exe release/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $zip dist/CodexBridgeToolkit.exe dist/CodexBridgeProxy.exe release/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title "Codex Bridge Toolkit $tag" `
              --notes-file release-notes.md
          }
