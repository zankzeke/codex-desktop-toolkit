name: Apply v0.5 Review Fixes

on:
  push:
    branches:
      - feat/v050-network-compatibility
    paths:
      - '.github/scripts/review_fix_v050_final.py'
      - '.github/workflows/review-fix-v050.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/v050-network-compatibility
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply final review hardening
        run: python .github/scripts/review_fix_v050_final.py

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

      - name: Commit reviewed fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex_toolkit_gui.py config_manager.py proxy.py support_bundle.py transport_policy.py tests/test_v050_review_fixes.py
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git commit -m "fix(v0.5.0): complete transport fallback and privacy hardening"
          git push origin HEAD:feat/v050-network-compatibility
