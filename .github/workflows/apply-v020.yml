name: Apply v0.2.0 UI refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v020.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed v0.2.0 patch
        run: |
          python -m pip install pillow
          python scripts/apply_v020.py

      - name: Remove one-shot migration files
        shell: pwsh
        run: |
          Remove-Item scripts/apply_v020.py -Force
          Remove-Item .github/workflows/apply-v020.yml -Force

      - name: Validate patched source
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit final v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.2.0 UI refresh [release]"
          git push origin HEAD:main
