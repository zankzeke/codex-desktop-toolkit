name: Finalize CodeQL security fixes

on:
  push:
    branches: [security/codeql-alert-triage]
    paths:
      - '.github/workflows/apply-codeql-security-fixes.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update security release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path('version.py')
          text = version.read_text(encoding='utf-8')
          if 'APP_VERSION = "0.4.3"' not in text:
              raise SystemExit('unexpected current version')
          version.write_text(text.replace('APP_VERSION = "0.4.3"', 'APP_VERSION = "0.4.4"', 1), encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 0.4.4 - 2026-09-14\n\n- Fixed CodeQL partial-SSRF findings by forwarding only the Codex endpoints the compatibility proxy is expected to handle.\n- Request query parameters are forwarded separately and are no longer concatenated into the configured upstream URL.\n- Unknown local proxy paths now return HTTP 404 without contacting the configured upstream.\n- Removed request-controlled path/URL values from runtime proxy log records to prevent log-forging/injection findings.\n- Added regression coverage for route allowlisting and unsupported endpoint rejection.\n- Re-ran the `security-extended` CodeQL query suite and confirmed zero SARIF findings after the fixes.\n\n'''
          if '## 0.4.4 - 2026-09-14' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          needle = '- It listens on loopback only.\n'
          addition = (
              '- It forwards only an allowlist of Codex API routes (`responses`, `responses/compact`, and `models`, including `/v1/...` aliases); unknown paths are rejected locally.\n'
              '- Request query parameters are forwarded separately from upstream URL construction, so request targets cannot extend or redirect the configured upstream path.\n'
          )
          if addition not in text:
              text = text.replace(needle, needle + addition, 1)
          readme.write_text(text, encoding='utf-8', newline='\n')

          security = Path('SECURITY.md')
          text = security.read_text(encoding='utf-8')
          needle = '- The proxy binds to `127.0.0.1` only.\n'
          addition = (
              '- The proxy forwards only an allowlist of Codex API routes and rejects unknown local paths before contacting the upstream.\n'
              '- Incoming query parameters are kept separate from upstream URL construction.\n'
          )
          if addition not in text:
              text = text.replace(needle, needle + addition, 1)
          security.write_text(text, encoding='utf-8', newline='\n')

          supply = Path('docs/SUPPLY_CHAIN_SECURITY.md')
          text = supply.read_text(encoding='utf-8')
          text = text.replace('CodexBridgeToolkit-0.4.3-windows-x64.zip', 'CodexBridgeToolkit-<version>-windows-x64.zip')
          supply.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.py CHANGELOG.md README.md SECURITY.md docs/SUPPLY_CHAIN_SECURITY.md
          git commit -m "security: prepare v0.4.4 CodeQL remediation release"
          git push origin HEAD:security/codeql-alert-triage
