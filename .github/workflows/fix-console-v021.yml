name: Apply v0.2.1 console log fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-console-v021.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch console-safe logging and v0.2.1 metadata
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise SystemExit(f'unexpected occurrence count in {path}: {old!r} -> {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              'proxy.py',
              'format="%(asctime)s %(levelname)-7s %(name)s — %(message)s",',
              'format="%(asctime)s %(levelname)-7s %(name)s | %(message)s",',
          )
          replace_exact(
              'proxy.py',
              '"→ %s %s | msg-id fixes: %d | reasoning drops: %d",',
              '"[OUT] %s %s | msg-id fixes: %d | reasoning drops: %d",',
          )
          replace_exact(
              'proxy.py',
              'logger.info("→ %s %s  →  %s", request.method, path.split("?")[0], self._mask_url(upstream_url))',
              'logger.info("[OUT] %s %s -> %s", request.method, path.split("?")[0], self._mask_url(upstream_url))',
          )
          replace_exact(
              'proxy.py',
              'logger.info("← upstream status: %d  (url: %s)", upstream_resp.status, self._mask_url(upstream_url))',
              'logger.info("[IN ] upstream status: %d (url: %s)", upstream_resp.status, self._mask_url(upstream_url))',
          )
          replace_exact(
              'proxy.py',
              'logger.info("⇆ WS Connect → %s", self._mask_url(upstream_url))',
              'logger.info("[WS ] connect -> %s", self._mask_url(upstream_url))',
          )
          replace_exact(
              'proxy.py',
              'logger.info("⇆ WS Upstream established, accepting client.")',
              'logger.info("[WS ] upstream established; accepting client")',
          )
          replace_exact(
              'proxy.py',
              'logger.info("⇆ WS Disconnected")',
              'logger.info("[WS ] disconnected")',
          )

          replace_exact('ui_theme.py', 'APP_VERSION = "0.2.0"', 'APP_VERSION = "0.2.1"')
          replace_exact('tests/test_gui_metadata.py', "assert ui_theme.APP_VERSION == '0.2.0'", "assert ui_theme.APP_VERSION == '0.2.1'")
          replace_exact(
              'README.md',
              'Download `CodexBridgeToolkit-0.2.0-windows-x64.zip`.',
              'Download `CodexBridgeToolkit-0.2.1-windows-x64.zip`.',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          entry = (
              '## 0.2.1 - 2026-09-13\n\n'
              '- Fixed garbled/mojibake characters in the packaged Windows proxy console.\n'
              '- Fixed Codex running-state detection when tasklist returns lowercase `codex.exe`.\n'
              '- Runtime log separators and transport markers are now ASCII-safe across Windows code pages.\n'
              '- No proxy request rewriting or upstream routing semantics changed.\n\n'
          )
          if entry not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG marker missing')
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8', newline='\n')

          Path('tests/test_console_logging.py').write_text('''from pathlib import Path\n\n\ndef test_proxy_runtime_log_markers_are_ascii_safe():\n    text = Path("proxy.py").read_text(encoding="utf-8")\n    required = [\n        "%(name)s | %(message)s",\n        "[OUT] %s %s",\n        "[IN ] upstream status",\n        "[WS ] connect ->",\n        "[WS ] upstream established; accepting client",\n        "[WS ] disconnected",\n    ]\n    for marker in required:\n        assert marker in text\n        assert marker.isascii()\n\n    forbidden_runtime_markers = [\n        "%(name)s — %(message)s",\n        "logger.info(\\\"→",\n        "logger.info(\\\"←",\n        "logger.info(\\\"⇆",\n    ]\n    for marker in forbidden_runtime_markers:\n        assert marker not in text\n''', encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Commit v0.2.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.py ui_theme.py README.md CHANGELOG.md tests/test_gui_metadata.py tests/test_console_logging.py
          git commit -m "fix: console mojibake and Codex status detection v0.2.1 [release]"
          git push origin HEAD:main
